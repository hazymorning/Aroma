name: Bug
description: Something in Aroma doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: This form is for bugs. Ideas and questions are welcome in the [Discussions](https://github.com/hazymorning/Aroma/discussions).
  - type: textarea
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
  - type: input
    attributes:
      label: Versions
      description: Aroma, Android and Mealie
      placeholder: Aroma 0.8.1, Android 15, Mealie 3.31
