name: CI

# Every push to main and every pull request that touches the app or its build. scripts/check.sh
# runs the same checks before a push, so a run here passes the first time: a failed run mails the
# owner. Changes to documents and to the other workflows run nothing.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - .github/workflows/mealie.yml
      - .github/workflows/release.yml
      - .github/workflows/screenshots.yml
      - .github/workflows/prune-releases.yml
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - .github/workflows/mealie.yml
      - .github/workflows/release.yml
      - .github/workflows/screenshots.yml
      - .github/workflows/prune-releases.yml

# A newer push to a pull request replaces its run. On main every run finishes, so no run ends as
# cancelled and mails for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Robolectric downloads large Android jars at test time; Maven Central asks clients to cache them.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      # One Gradle run, so formatting, lint, the tests and the APK build share one compile and run
      # side by side. The tests against a real Mealie run in the Mealie workflow, weekly and when
      # the data layer changes; the screenshots render for a design review, in the Screenshots one.
      - name: Checks, tests and APK
        run: ./gradlew spotlessCheck :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: aroma-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Which test failed, and why, without reading the whole log.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests
