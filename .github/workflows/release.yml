name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Read version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AROMA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing needs the repository secrets AROMA_KEYSTORE_BASE64 and AROMA_KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aroma-release.p12"
          echo "AROMA_KEYSTORE=$RUNNER_TEMP/aroma-release.p12" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew :app:assembleRelease
        env:
          AROMA_KEYSTORE_PASSWORD: ${{ secrets.AROMA_KEYSTORE_PASSWORD }}

      # Never publish an APK that is not signed with the release certificate.
      - name: Check signature
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          grep -q "certificate SHA-256 digest: $CERTIFICATE" signature.txt
        env:
          CERTIFICATE: 493b8d5e419ca8c6615ff26504bc22cb56895ce6fc68f1f95b5fd53ccf07028f

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="Aroma-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          awk -v heading="## $VERSION " 'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          checksum=$(sha256sum "$apk" | cut -d " " -f 1)
          printf '\nSHA-256 %s: %s\n' "\`$apk\`" "\`$checksum\`" >> notes.md
          gh release create "v$VERSION" "$apk" --title "Aroma $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
