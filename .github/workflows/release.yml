name: Release

# Started by hand (Actions > Release > Run workflow): builds the versionName in app/build.gradle.kts
# as "Aroma 0.3.0", signed with the release key, with its CHANGELOG entry as notes. By default it
# only drafts the release, from any branch, for someone to publish by hand on the releases page; a
# draft has no tag yet and is seen by no one, the app's update check included. Drafting a version
# again replaces its draft. Unticking "draft" publishes at once, and only from main once CI passed
# there. A version that is already out is left as it is.
on:
  workflow_dispatch:
    inputs:
      draft:
        description: Only draft the release, to publish by hand later
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: inputs.draft || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      released: ${{ steps.read.outputs.released }}
      drafted: ${{ steps.read.outputs.drafted }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          state=$(gh release view "v$version" --json isDraft --jq 'if .isDraft then "draft" else "out" end' 2> /dev/null || echo none)
          if [ "$state" = out ]; then
            echo "::notice::Aroma $version is already released"
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$state" = draft ] && [ "$DRAFT" != true ]; then
            echo "::notice::Aroma $version is drafted: publish its draft on the releases page"
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "drafted=$([ "$state" = draft ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if ! awk -v heading="## $version " 'index($0, heading) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $version"
            exit 1
          fi
          echo "released=false" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AROMA_KEYSTORE_BASE64 }}
          HAS_PASSWORD: ${{ secrets.AROMA_KEYSTORE_PASSWORD != '' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ "$HAS_PASSWORD" != true ]; then
            echo "::error::Add the repository secrets AROMA_KEYSTORE_BASE64 and AROMA_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aroma-release.p12"
          echo "AROMA_KEYSTORE=$RUNNER_TEMP/aroma-release.p12" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew :app:assembleRelease
        env:
          AROMA_KEYSTORE_PASSWORD: ${{ secrets.AROMA_KEYSTORE_PASSWORD }}

      # Never publish an APK that is not signed with the release certificate: the app's update
      # check installs only what carries it.
      - name: Check signature
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          grep -q "certificate SHA-256 digest: $CERTIFICATE" signature.txt
        env:
          CERTIFICATE: 493b8d5e419ca8c6615ff26504bc22cb56895ce6fc68f1f95b5fd53ccf07028f

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
          DRAFTED: ${{ needs.version.outputs.drafted }}
        run: |
          apk="Aroma-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          awk -v heading="## $VERSION " 'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          if [ "$DRAFT" = true ]; then
            # The draft of an earlier run makes way for this one.
            if [ "$DRAFTED" = true ]; then gh release delete "v$VERSION" --yes; fi
            gh release create "v$VERSION" "$apk" --draft --title "Aroma $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          else
            gh release create "v$VERSION" "$apk" --title "Aroma $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
