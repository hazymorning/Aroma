name: Release

# Started by hand once CI passed on main (Actions > Release > Run workflow): publishes the
# versionName in app/build.gradle.kts as "Aroma 0.3.0", signed with the release key, with its
# CHANGELOG entry as notes. A version that is already out is left as it is.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      released: ${{ steps.read.outputs.released }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::notice::Aroma $version is already released"
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! awk -v heading="## $version " 'index($0, heading) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $version"
            exit 1
          fi
          echo "released=false" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AROMA_KEYSTORE_BASE64 }}
          HAS_PASSWORD: ${{ secrets.AROMA_KEYSTORE_PASSWORD != '' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ "$HAS_PASSWORD" != true ]; then
            echo "::error::Add the repository secrets AROMA_KEYSTORE_BASE64 and AROMA_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aroma-release.p12"
          echo "AROMA_KEYSTORE=$RUNNER_TEMP/aroma-release.p12" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew :app:assembleRelease
        env:
          AROMA_KEYSTORE_PASSWORD: ${{ secrets.AROMA_KEYSTORE_PASSWORD }}

      # Never publish an APK that is not signed with the release certificate: the app's update
      # check installs only what carries it.
      - name: Check signature
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          grep -q "certificate SHA-256 digest: $CERTIFICATE" signature.txt
        env:
          CERTIFICATE: 493b8d5e419ca8c6615ff26504bc22cb56895ce6fc68f1f95b5fd53ccf07028f

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="Aroma-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          awk -v heading="## $VERSION " 'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          checksum=$(sha256sum "$apk" | cut -d " " -f 1)
          printf '\nSHA-256 %s: %s\n' "\`$apk\`" "\`$checksum\`" >> notes.md
          gh release create "v$VERSION" "$apk" --title "Aroma $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
